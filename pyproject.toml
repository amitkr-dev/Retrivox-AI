[project]
name = "agentic-rag-assistant"
version = "0.1.0"
description = "An agentic retrieval-augmented generation assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "ddgs>=9.16.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.3",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langsmith>=0.14.14",
    "openevals>=0.2.2",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.3",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.2.0",
    "sse-starlette>=3.6.0",
    "tavily-python>=0.8.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
